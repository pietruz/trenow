services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: trainroot
      MYSQL_DATABASE: train_tracker
      MYSQL_USER: trainuser
      MYSQL_PASSWORD: trainpass
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build: ./backend
    volumes:
      - ./backend/src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/src:/var/www/html
    depends_on:
      - php

volumes:
  db_data:
